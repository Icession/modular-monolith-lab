spring.application.name=modular-monolith

# Supabase (Postgres) connection - values come from environment variables,
# never hardcoded / never committed. See .env.example.
SUPABASE_DB_URL=jdbc:postgresql://db.sxlqgzkkqeqbdqkrfoip.supabase.co:5432/postgres?user=postgres&password=ModularActivity213
SUPABASE_DB_USERNAME=postgres
SUPABASE_DB_PASSWORD=ModularActivity213
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created via sql/schema.sql against Supabase directly,
# so Hibernate should only validate, never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

server.port=8080

# Stock level below which a LowStockEvent is published after a reservation
inventory.low-stock-threshold=5

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---------------------------------------------------------------------------
# Lab 3 - LegacySupply (supplier module / Anti-Corruption Layer)
# ---------------------------------------------------------------------------
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
# Your student ID and the API key from your instructor - environment variables only, never committed.
legacysupply.client-id=${LS_CLIENT_ID:}
legacysupply.api-key=${LS_API_KEY:}
# Resilience: give up on a slow call after 3s, at most 3 tries per call, backoff starts at 500ms
legacysupply.timeout-ms=3000
legacysupply.max-attempts=3
legacysupply.backoff-ms=500

# Our product -> LegacySupply item, as productId:SupplierSku:PackSize (comma-separated).
# REPLACE the SKUs and pack sizes with the values from YOUR GET /catalog (Part B).
supplier.items=P100:NEC-7110:10,P200:NEC-6819:20,P300:NEC-5803:12

# A low-stock reorder tops the product back up to this many units
supplier.reorder-target-stock=20
# How often the scheduled jobs run (ms). Kept modest to stay inside the request quota.
supplier.dispatch-interval-ms=20000
supplier.tracking-interval-ms=60000
