spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:modular-monolith-lab/backend/.env[.properties]
spring.application.name=modular-monolith

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=12

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

server.port=8080

inventory.low-stock-threshold=10

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=${LS_CLIENT_ID:}
legacysupply.api-key=${LS_API_KEY:}
legacysupply.timeout-ms=3000
legacysupply.max-attempts=3
legacysupply.backoff-ms=500

supplier.items=P100:NEC-7110:10,P200:NEC-6819:20,P300:NEC-5803:12

supplier.reorder-target-stock=40
supplier.dispatch-interval-ms=20000
supplier.tracking-interval-ms=20000

spring.task.scheduling.pool.size=8
spring.task.execution.pool.core-size=8

tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
tiangge.client-id=${LS_CLIENT_ID:}
tiangge.api-key=${LS_API_KEY:}
tiangge.timeout-ms=3000
tiangge.max-attempts=3
tiangge.backoff-ms=300

channel.listings=P100,P200,P300
channel.feed-interval-ms=3000
channel.feed-page-size=50
channel.parallel-decisions=6
channel.heartbeat-interval-ms=30000
channel.backorder-extra-units=20
channel.backorder-max-wait-minutes=30